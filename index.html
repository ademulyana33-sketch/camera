<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner QR Absensi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#1f2937}
.container{width:min(94%,560px);margin:24px auto}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.logo{text-align:center;font-size:42px;margin-bottom:8px}
h1{margin:0 0 8px;text-align:center;font-size:24px}
.subtitle{text-align:center;color:#6b7280;margin-bottom:20px}
#reader{width:100%;min-height:280px;border:2px dashed #cbd5e1;border-radius:14px;overflow:hidden;background:#f8fafc}
.status{margin:14px 0;padding:12px 14px;border-radius:10px;background:#eef2ff;font-size:14px;line-height:1.5}
.status.error{background:#fee2e2;color:#991b1b}
.status.success{background:#dcfce7;color:#166534}
.buttons{display:flex;gap:10px;margin-top:16px}
button{flex:1;border:0;border-radius:10px;padding:13px 15px;font-size:15px;font-weight:600;cursor:pointer}
#startBtn{background:#2563eb;color:#fff}
#switchBtn{background:#e5e7eb;color:#111827}
button:disabled{opacity:.55;cursor:not-allowed}
.hint{margin-top:16px;font-size:13px;color:#6b7280;line-height:1.6}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="logo">📷</div>
<h1>Scanner QR Absensi</h1>
<div class="subtitle">Arahkan kamera ke QR Code siswa</div>

<div id="status" class="status">
Tekan <b>Mulai Kamera</b> untuk mengaktifkan kamera.
</div>

<div id="reader"></div>

<div class="buttons">
<button id="startBtn" onclick="startCamera()">📷 Mulai Kamera</button>
<button id="switchBtn" onclick="switchCamera()" disabled>🔄 Ganti Kamera</button>
</div>

<div class="hint">
<b>Petunjuk:</b><br>
1. Izinkan akses kamera jika browser meminta izin.<br>
2. Arahkan kamera ke QR Code siswa.<br>
3. Setelah QR terbaca, halaman akan otomatis kembali ke aplikasi absensi.
</div>
</div>
</div>

<script>
let scanner=null;
let cameras=[];
let currentCameraIndex=0;
let scanning=false;
let callback='';
let nonce='';

function setStatus(message,type=''){
  const el=document.getElementById('status');
  el.className='status'+(type?' '+type:'');
  el.innerHTML=message;
}

function getParams(){
  const params=new URLSearchParams(window.location.search);
  callback=params.get('callback')||'';
  nonce=params.get('nonce')||'';

  if(!callback||!nonce){
    setStatus('Parameter scanner tidak lengkap. Silakan buka scanner melalui aplikasi absensi.','error');
    document.getElementById('startBtn').disabled=true;
    return false;
  }

  try{
    const url=new URL(callback);
    const validHost=url.protocol==='https:' &&
      (url.hostname==='script.google.com' ||
       url.hostname.endsWith('.googleusercontent.com'));

    if(!validHost) throw new Error('Callback tidak valid');
  }catch(e){
    setStatus('Alamat callback tidak valid.','error');
    document.getElementById('startBtn').disabled=true;
    return false;
  }
  return true;
}

async function startCamera(){
  if(scanning)return;

  if(!callback||!nonce){
    setStatus('Scanner harus dibuka dari aplikasi absensi. Jangan membuka URL scanner secara manual.','error');
    return;
  }

  const btn=document.getElementById('startBtn');
  btn.disabled=true;
  btn.textContent='⏳ Menyiapkan kamera...';

  try{
    setStatus('Meminta izin kamera...');

    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error('Browser tidak mendukung akses kamera. Gunakan Chrome/Edge/Safari terbaru melalui HTTPS.');
    }

    const stream=await navigator.mediaDevices.getUserMedia({
      video:true,audio:false
    });
    stream.getTracks().forEach(track=>track.stop());

    cameras=await Html5Qrcode.getCameras();

    if(!cameras||cameras.length===0){
      throw new Error('Kamera tidak ditemukan pada perangkat.');
    }

    const backIndex=cameras.findIndex(c=>
      /back|rear|environment|belakang/i.test(c.label||'')
    );
    currentCameraIndex=backIndex>=0?backIndex:0;

    await runScanner(cameras[currentCameraIndex].id);
    document.getElementById('switchBtn').disabled=cameras.length<2;

  }catch(error){
    console.error(error);
    let message='Tidak dapat membuka kamera.';

    if(error&&error.name==='NotAllowedError'){
      message='Akses kamera ditolak. Silakan izinkan kamera untuk situs ini pada pengaturan browser, lalu coba lagi.';
    }else if(error&&error.name==='NotFoundError'){
      message='Kamera tidak ditemukan pada perangkat.';
    }else if(error&&error.name==='NotReadableError'){
      message='Kamera sedang digunakan aplikasi lain. Tutup aplikasi yang menggunakan kamera, lalu coba lagi.';
    }else if(error&&error.message){
      message=error.message;
    }

    setStatus(message,'error');
    btn.disabled=false;
    btn.textContent='📷 Mulai Kamera';
  }
}

async function runScanner(cameraId){
  if(scanner){
    try{await scanner.stop();}catch(e){}
    try{scanner.clear();}catch(e){}
  }

  scanner=new Html5Qrcode('reader');
  scanning=true;

  setStatus('Kamera aktif. Arahkan kamera ke QR Code siswa.');
  document.getElementById('startBtn').textContent='🟢 Kamera Aktif';

  await scanner.start(
    cameraId,
    {
      fps:10,
      qrbox:function(viewfinderWidth,viewfinderHeight){
        const minEdge=Math.min(viewfinderWidth,viewfinderHeight);
        const size=Math.floor(minEdge*0.70);
        return {width:size,height:size};
      },
      aspectRatio:1.0
    },
    onScanSuccess,
    onScanFailure
  );
}

function onScanFailure(errorMessage){}

async function onScanSuccess(decodedText){
  if(!scanning)return;
  scanning=false;

  const nisn=String(decodedText||'').trim();

  if(!nisn){
    setStatus('QR Code tidak berisi data.','error');
    scanning=true;
    return;
  }

  setStatus('QR berhasil dibaca. Mengirim data ke aplikasi...','success');

  if(scanner){
    try{await scanner.stop();}catch(e){}
  }

  document.getElementById('switchBtn').disabled=true;

  try{
    const url=new URL(callback);
    url.searchParams.set('scan_nonce',nonce);
    url.searchParams.set('nisn',nisn);
    window.location.href=url.toString();
  }catch(error){
    setStatus('Gagal membuat alamat callback.','error');
  }
}

async function switchCamera(){
  if(!cameras||cameras.length<2)return;

  try{
    currentCameraIndex=(currentCameraIndex+1)%cameras.length;
    setStatus('Mengganti kamera...');

    if(scanner){
      try{await scanner.stop();}catch(e){}
    }

    await runScanner(cameras[currentCameraIndex].id);
  }catch(error){
    console.error(error);
    setStatus('Gagal mengganti kamera: '+error.message,'error');
  }
}

getParams();
// Kamera tidak otomatis dinyalakan.
// Pengguna menekan tombol "Mulai Kamera".
</script>
</body>
</html>
